[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcc-youtube-video-downloader"
version = "1.0.0"
description = "Desktop video downloader built with Python, Flask, PySide6 and yt-dlp."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Pakistan Code Center" }]
dependencies = [
    "Flask>=3.0,<4",
    "PySide6>=6.7,<7",
    "PySide6-WebEngine>=6.7,<7",
    "requests>=2.31,<3",
    "yt-dlp>=2025.1.0,<2027",
]

[project.scripts]
pcc-youtube-downloader = "youtube_downloader.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
